<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signup Page</title>
</head>
<body style="background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="text-align: center; padding: 40px; border: 1px solid #444; border-radius: 12px; background-color: #1e1e1e; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);">
        <h2>Signup</h2>
        <form action="/signup" method="POST">
            <div style="margin-bottom: 20px;">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required style="padding: 8px; width: 100%; border: none; border-radius: 6px; margin-top: 5px; background-color: #333; color: #fff;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required style="padding: 8px; width: 100%; border: none; border-radius: 6px; margin-top: 5px; background-color: #333; color: #fff;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required style="padding: 8px; width: 100%; border: none; border-radius: 6px; margin-top: 5px; background-color: #333; color: #fff;">
            </div>
            <button type="submit" style="padding: 10px 20px; border: none; border-radius: 6px; background-color: #FBA518; color: #121212; cursor: pointer;">Signup</button>
        </form>
    </div>
</body>
</html>
