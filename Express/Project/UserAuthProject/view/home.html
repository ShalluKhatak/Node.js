<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home Page</title>
  </head>
  <body
    style="
      background-color: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    "
  >
    <div
      style="
        text-align: center;
        padding: 40px;
        border: 1px solid #444;
        border-radius: 12px;
        background-color: #1e1e1e;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      "
    >
      <h2>Welcome to Home</h2>
      <div>
        <button
          id="logout_form"
          style="
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #fba518;
            color: #121212;
            cursor: pointer;
          "
        >
          Logout
        </button>
      </div>
    </div>
    <script src="/script/logOutScript.js"></script>
  </body>
</html>
